name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  secrets:
    name: Redacted credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan publishing history and current files
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner --log-opts="HEAD --branches --tags --remotes"
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner

  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts

  factual-contract:
    name: Factual review / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install . 'vita-cv==2.8.0'
      - run: python tests/smoke/run_factual_contract.py
      - run: python tests/smoke/run_requirements_contract.py

  browser:
    name: Browser and real PDF integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[test]'
      - name: Configure Ubuntu package downloads
        timeout-minutes: 2
        run: |
          # The hosted runner's Azure mirror can trickle downloads until the
          # entire job times out, before any browser/PDF tests have started.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo tee /etc/apt/apt.conf.d/80-ci-network > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - name: Install Chromium and system dependencies
        timeout-minutes: 5
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Install TeX
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra
      - run: python tests/browser_check.py --browser chromium
      - run: python tests/browser_jobs.py --browser chromium
      - run: python tests/browser_workflow.py --browser chromium
      - run: python tests/browser_ai_settings.py --browser chromium
      - run: python tests/browser_custom_environment.py --browser chromium
      - run: python tests/browser_resume.py --browser chromium
      - run: python tests/browser_inspector.py --browser chromium
      - run: python tests/browser_inspector_states.py --browser chromium
      - run: python tests/browser_provider_failures.py --browser chromium
      - name: Install the minimum factual-change backend
        run: python -m pip install 'vita-cv==2.8.0'
      - run: python tests/browser_factual_reviews.py --browser chromium
      - run: python tests/browser_requirements.py --browser chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-previews
          path: .test-artifacts/*.png
          include-hidden-files: true
          retention-days: 7

  package:
    name: Build and test distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[release]'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_package.py dist
      - run: python scripts/check_privacy.py --history --dist dist
      - run: python tests/smoke/run_installed_package.py dist/*.whl --ai
      - run: python tests/smoke/run_installed_package.py dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
