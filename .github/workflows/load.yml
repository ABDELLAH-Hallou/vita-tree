name: Synthetic workflow load

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONPATH: src:tests

jobs:
  profiles:
    name: Load / ${{ matrix.profile }} / ${{ matrix.pdf }} / sample ${{ matrix.replica }}${{ matrix.profile == 'sustained' && ' (orchestration advisory)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ci
            pdf: simulated
            replica: 1
          - profile: sustained
            pdf: simulated
            replica: 1
          - profile: sustained
            pdf: simulated
            replica: 2
          - profile: sustained
            pdf: simulated
            replica: 3
          - profile: ci
            pdf: real
            replica: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[test,benchmark]'
      - name: Install TeX for the restricted compiler profile
        if: matrix.pdf == 'real'
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends texlive-latex-extra
      - run: python tests/run_load_profile.py --profile ${{ matrix.profile }} --pdf ${{ matrix.pdf }} --replica ${{ matrix.replica }} --output .test-artifacts/load-profile --enforce-budgets ${{ matrix.profile == 'sustained' && '--advisory-orchestration' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-${{ matrix.profile }}-${{ matrix.pdf }}-${{ matrix.replica }}
          path: .test-artifacts/load-profile/results.json
          include-hidden-files: true
          retention-days: 14

  browser:
    name: Browser load / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [ci, sustained]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[test,benchmark]'
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python tests/browser_load_profile.py --profile ${{ matrix.profile }} --output .test-artifacts/load-browser --enforce-budgets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-browser-${{ matrix.profile }}
          path: |
            .test-artifacts/load-browser/browser-results.json
            .test-artifacts/load-browser/synthetic-history.png
            .test-artifacts/load-browser/synthetic-history-bottom.png
          include-hidden-files: true
          retention-days: 14
