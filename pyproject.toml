[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-tree"
version = "0.1.0"
description = "A fast visual browser for Git-based CV branches"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vita Tree contributors" }]
keywords = ["git", "latex", "resume", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["pylatexenc==2.10"]

[project.optional-dependencies]
test = ["playwright>=1.50,<2", "pypdf>=6,<7"]

[project.scripts]
vt = "vita_tree.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vita_tree = ["static/*", "static/vendor/*", "static/vendor/standard_fonts/*", "static/vendor/cmaps/*", "static/vendor/wasm/*"]
